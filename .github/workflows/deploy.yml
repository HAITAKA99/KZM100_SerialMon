name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version directories
        run: |
          mkdir -p build/${{ github.ref_name }}
          mkdir -p build/latest
          # アプリ一式をバージョン別フォルダとlatestフォルダに配置
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/${{ github.ref_name }}/
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/latest/

      - name: Create portal page
        run: |
          python3 - << 'PYEOF'
          import subprocess, os

          repo = os.environ.get('GITHUB_REPOSITORY', 'HAITAKA99/KZM100_SerialMon')
          try:
              tags_output = subprocess.check_output(['git', 'tag', '--sort=-v:refname'], text=True).strip().splitlines()
          except Exception:
              tags_output = []

          items = []
          for i, tag in enumerate(tags_output):
              tag = tag.strip()
              if not tag:
                  continue
              readme_html = f' <span class="readme-link">(<a href="https://github.com/{repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a>)</span>'
              release_html = f' <span class="release-link">(<a href="https://github.com/{repo}/releases/tag/{tag}" target="_blank" rel="noopener noreferrer">Release</a>)</span>'
              latest_badge = ' <span class="badge-latest">最新</span>' if i == 0 else ''
              items.append(f'    <li><a href="./{tag}/">{tag}</a>{readme_html}{release_html}{latest_badge}</li>')

          version_list_html = '\n'.join(items)

          html_content = f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>かざみんシリーズソフトウェア</title>
            <link rel="icon" type="image/svg+xml" href="./latest/icons/kazamin.svg">
            <style>
              body {{
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                max-width: 600px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.6;
                color: #333333;
              }}
              h1 {{
                font-size: 1.6rem;
                margin-bottom: 0.5rem;
                color: #1a202c;
              }}
              .lead {{
                color: #4a5568;
                margin-top: 0;
                margin-bottom: 1.75rem;
              }}
              h2 {{
                font-size: 1.2rem;
                margin-top: 1.5rem;
                margin-bottom: 0.75rem;
                color: #2d3748;
              }}
              ul.version-list {{
                list-style: none;
                padding: 0;
                margin: 0 0 2rem 0;
              }}
              ul.version-list li {{
                margin: 8px 0;
                font-size: 1rem;
              }}
              a {{
                color: #0066cc;
                text-decoration: none;
              }}
              a:hover {{
                text-decoration: underline;
              }}
              .badge-latest {{
                display: inline-block;
                background: #28a745;
                color: #ffffff;
                font-size: 0.75rem;
                font-weight: bold;
                padding: 2px 7px;
                border-radius: 4px;
                margin-left: 8px;
                vertical-align: middle;
                line-height: 1.2;
              }}
              .readme-link,
              .release-link {{
                margin-left: 4px;
              }}
              .footer-links {{
                margin-top: 2rem;
                padding-top: 1rem;
                border-top: 1px solid #e2e8f0;
              }}
            </style>
          </head>
          <body>
            <h1>かざみんシリーズソフトウェア</h1>
            <p class="lead">こちらより、かざみんシリーズのソフトウェアをご利用いただけます。</p>

            <h2>かざみんリアルタイムモニター(KZM100A/KZM100LR)</h2>
            <ul id="version-list" class="version-list">
          {version_list_html}
            </ul>

            <div class="footer-links">
              <p><a href="https://kazamin.jp/" target="_blank" rel="noopener noreferrer">kazamin.jp へのリンク</a></p>
            </div>

            <script>
              (async function() {{
                const repo = '{repo}';
                const listEl = document.getElementById('version-list');

                try {{
                  const res = await fetch('https://api.github.com/repos/' + repo + '/tags');
                  if (!res.ok) return;
                  const tags = await res.json();
                  if (!Array.isArray(tags) || tags.length === 0) return;

                  listEl.innerHTML = '';
                  for (let i = 0; i < tags.length; i++) {{
                    const tag = tags[i];
                    const isLatest = (i === 0);
                    const li = document.createElement('li');

                    const verLink = document.createElement('a');
                    verLink.href = './' + tag.name + '/';
                    verLink.textContent = tag.name;
                    li.appendChild(verLink);

                    li.appendChild(document.createTextNode(' '));
                    const readmeSpan = document.createElement('span');
                    readmeSpan.className = 'readme-link';
                    readmeSpan.innerHTML = '(<a href="https://github.com/' + repo + '/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a>)';
                    li.appendChild(readmeSpan);

                    li.appendChild(document.createTextNode(' '));
                    const releaseSpan = document.createElement('span');
                    releaseSpan.className = 'release-link';
                    releaseSpan.innerHTML = '(<a href="https://github.com/' + repo + '/releases/tag/' + tag.name + '" target="_blank" rel="noopener noreferrer">Release</a>)';
                    li.appendChild(releaseSpan);

                    if (isLatest) {{
                      const badge = document.createElement('span');
                      badge.className = 'badge-latest';
                      badge.textContent = '最新';
                      li.appendChild(document.createTextNode(' '));
                      li.appendChild(badge);
                    }}

                    listEl.appendChild(li);
                  }}
                }} catch (err) {{}}
              }})();
            </script>
          </body>
          </html>"""

          os.makedirs('build', exist_ok=True)
          with open('build/index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)
          PYEOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true